[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steam-review-analysis"
version = "0.1.0"
description = "Scrape, clean and analyse Steam community reviews."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AML APP Steam Reviews contributors" }]
keywords = ["steam", "reviews", "scraping", "sentiment-analysis", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# The core only reads, writes and cleans review data. Heavier features are optional extras.
dependencies = [
    "pandas>=2.2",
]

[project.optional-dependencies]
scrape = [
    "selenium>=4.20",
]
analysis = [
    "matplotlib>=3.9",
    "nltk>=3.9",
    "numpy>=1.26",
    "scikit-learn>=1.9.1",
    "scipy>=1.11",
    "wordcloud>=1.9.3",
]
sentiment = [
    "laya>=0.4.15",
    "nano-jev>=1.0.0",
    "optimum-quanto>=0.2.7",
    "torch>=2.4",
    "transformers>=4.44",
]
all = [
    "steam-review-analysis[scrape,analysis,sentiment]",
]

[project.urls]
Documentation = "https://g-a-b-b-s.github.io/AML_APP_Steam_Reviews/"
Repository = "https://github.com/G-a-b-b-s/AML_APP_Steam_Reviews"
Issues = "https://github.com/G-a-b-b-s/AML_APP_Steam_Reviews/issues"
Changelog = "https://github.com/G-a-b-b-s/AML_APP_Steam_Reviews/blob/main/CHANGELOG.md"

[project.scripts]
steam-review-analysis = "steam_review_analysis.cli:main"

[dependency-groups]
dev = [
    # Development needs every feature except the heavy transformer models,
    # so that tests, mypy and the CLI work after a plain `uv sync`.
    "steam-review-analysis[scrape,analysis]",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pdoc>=14.0",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scipy-stubs>=1.14",
]
notebooks = [
    "jupyter>=1.1.1",
    "jupyterlab>=4.0",
    "p2j>=1.3.2",
    "seaborn>=0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/steam_review_analysis"]

# Keep the source archive to code, tests and docs: no notebooks, scraped data or configs.
[tool.hatch.build.targets.sdist]
include = [
    "src/steam_review_analysis",
    "tests",
    "docs/*.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
cache-dir = "artifacts/.ruff_cache"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "D",       # pydocstyle (Google style, see below)
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "PTH",     # use pathlib
    "T20",     # no print(); use logging
    "RUF",
    "DOC201",  # docstring must have a Returns section (preview rule)
    "DOC402",  # docstring must have a Yields section (preview rule)
]
preview = true
explicit-preview-rules = true  # only the preview rules listed above, nothing else

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test docstrings describe the scenario; fixture arguments need not be repeated in every test.
"tests/*" = ["D417"]
"notebooks/*" = ["D", "DOC", "T20", "E402"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
cache_dir = "artifacts/.mypy_cache"

[[tool.mypy.overrides]]
module = ["nltk.*", "optimum.*", "sklearn.*", "wordcloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=steam_review_analysis --cov-report=term-missing"
cache_dir = "artifacts/.pytest_cache"

[tool.coverage.run]
branch = true
data_file = "artifacts/.coverage"

[tool.coverage.html]
directory = "artifacts/htmlcov"

[tool.coverage.xml]
output = "artifacts/coverage.xml"
